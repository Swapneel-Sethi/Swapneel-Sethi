<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Swapneel Sethi — developer identity card</title>
  <desc id="cardDesc">Dark holographic identity card for @Swapneel-Sethi, a full-stack developer building AI-assisted products. 7 public repositories, 14 contributions in the last twelve months, 2 followers, on GitHub since 2025. Stack: TypeScript, JavaScript, Python, Node.js, Next.js, React.</desc>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.42" stop-color="#22d3ee"/>
      <stop offset="0.78" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topGlow" cx="0.2" cy="0" r="0.85">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b242e"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.014"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="18" y="18" width="844" height="320" rx="12"/>
